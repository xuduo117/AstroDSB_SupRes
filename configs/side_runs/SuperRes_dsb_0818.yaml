# General Experiment Information
experiment:
  name: "astro_supres_dsb_0818"
  seed: 42
  base_log_dir: "results"
  resume: True  
  checkpoint_path: "results/astro_supres_dsb_0818/latest.pt"

# Dataset Configuration
dataset:
  type: "ISRF"
  roots:
    - '/scratch/xuduo117/Project_DSB/AstroDSB_SupRes/ML_data/'
  skirt_roots:
    - '/scratch/xuduo117/project_SKIRT/Observational_Galleries/'
  # NOTE: `skirt_fraction` used to live here and is now a dead key -- only
  # data/factory_backup2.py still reads it. The live mix is set by
  # DATASET_FRACTIONS_OVERRIDE in data/datasets.py, currently
  # (dust 0.50, SKIRT 0.50, FIRE 0.00), and is echoed in the [Mix] log line at
  # startup. `fire_roots` is left unset on purpose: factory.py still scans its
  # default path and builds the dataset, but the 0.00 weight means it is never
  # sampled, and the log says so.

  # Set explicitly rather than left to the 0.12 default. The diffuse branch in
  # datasets.py is an `elif` after the stellar branch, so stellar_prob competes
  # with it directly -- but more importantly the injected star fields are one of
  # the sources of compact structure that the gravity-free diffuse work exists
  # to counter. At the 0.12 default this run would inject them 2.4x more often
  # than the 0701 run did (measured: 11.98% vs 5.00% of samples).
  stellar_prob: 0.05
  clean_prob: 0.15

  primary_indices: [0]   # 4.5um, 24um, 250um
  cond_indices: [0]      # Observations used for bridge guidance
  split_mode: "physical_ood"  ### "random"
  ood_keywords: ["I100"]  # You can add more like ["I100", "B1"]
  # test_size: 0.01
  batch_size: 2               
  num_workers: 16
  persistent_workers: true
  prefetch_factor: 4          # <-- NEW: Forces workers to prepare 4 batches in advance
  
  patch_size: 256
  num_patches_train: 8         
  num_patches_val: 4
  mask_taper_sigma: 1.2
  augment: true
  
  # Generative Robustness (Curriculum)
  artifacts:
    enable: true               # Turn on for the full 2000ep run
    activation_epoch: 50        
    prob_bad_pixel: 0.001
    prob_stripe: 0.005
    mask_loss: False            # Use masking to handle rotation/artifacts
  
  noise:
    m2_noise_level: 0.01       

# Model & Bridge Architecture
model:
  type: "dsb"                  # <--- Logic switch for Factory
  in_channels: 1            
  out_channels: 1           
  cond_channels: 1     # For the Planck condition

  base_channels: 128
  num_res_blocks: 2
  attention_resolutions: [32,16, 8]
  dropout: 0.1
  channel_mult: [1,1, 2, 2, 4,4]
  
  use_observable_enhancement: true
  
  # Bridge Settings
  intervals: 1000
  beta_max: 0.02
  learning_rate: 0.0001
  ema_decay: 0.999

# Training Control (Synced with DDPM version)
training:
  epochs: 6102
  snapshot_iter_freq: 5000     # Mid-epoch visual/checkpoint check
  archive_interval: 100        # Permanent checkpoint every 100 epochs
  snapshot_epoch_freq: 1       # End-of-epoch full validation
  snapshot_skip_steps: 50      # Fast sampling for validation snapshots
  distributed: true
  
# Inference/Sliding Window Logic
inference:
  sampling_skip_steps: 10      # High quality but faster than training
  stride: 32