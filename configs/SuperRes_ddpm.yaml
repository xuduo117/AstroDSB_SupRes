# General Experiment Information
experiment:
  name: "astro_supres_ddpm_v1"
  seed: 42
  base_log_dir: "results"
  resume: True  
  checkpoint_path: "results/astro_supres_ddpm_v1/latest.pt"

# Dataset Configuration (Identical to DSB for fair comparison)
dataset:
  type: "ISRF"
  roots:
    - '/scratch/xuduo117/Project_DSB/AstroDSB_SupRes/ML_data/'
  primary_indices: [0]
  cond_indices: [0]
  # test_size: 0.01
  split_mode: "physical_ood"  ### "random"
  ood_keywords: ["I100"]  # You can add more like ["I100", "B1"]
  batch_size: 2                
  num_workers: 8
  persistent_workers: true
  patch_size: 256
  num_patches_train: 8         
  num_patches_val: 4
  augment: true
  mask_taper_sigma: 1.2
  artifacts:
    enable: true
    activation_epoch: 50        
    prob_bad_pixel: 0.001
    prob_stripe: 0.005
    mask_loss: False            # Use masking to handle rotation/artifacts
  noise:
    m2_noise_level: 0.01  
    noise_smooth_sigma: 0.8     

# Model & DDPM Architecture
model:
  type: "ddpm"                 # <--- DDPM Switch
  ch: 128                      # ch in DDPM logic
  out_channels: 1                    # Target: FUV, Total
  in_channels: 1               # Obs: Dust
  cond_channels: 1     # For the Planck condition
  num_res_blocks: 2
  attn_resolutions: [32,16, 8]
  dropout: 0.1
  ch_mult: [1,1, 2, 2, 4,4]
  resamp_with_conv: true
  
  # DDPM Specific Variance Schedule
  intervals: 1000              # Diffusion timesteps
  # beta_schedule: "linear"
  # beta_start: 0.0001
  # beta_end: 0.02
  
  snr_threshold: 20.0
  background_loss_weight: 0.02
  beta_schedule: "cosine"  # Highly recommended for cleaning 'snow'
  # beta_start and beta_end are often ignored or recalculated for cosine
  learning_rate: 0.0001        # Slightly lower LR for better convergence stability
  ema_decay: 0.9999

  # learning_rate: 0.0002        # DDPM often prefers slightly higher LR
  # ema_decay: 0.9999            # DDPM standard EMA is higher

training:
  epochs: 2702
  distributed: true
  snapshot_iter_freq: 5000   # Saves 'latest.pt' every ~30 mins (safety)
  archive_interval: 100       # Archive every 100 epochs
  sampling_steps: 50         # Fast sampling for both mid-epoch and end-of-
  min_lr_ratio: 0.01         # Finish at 1/100th of start LR